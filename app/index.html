<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UB Tools Studio</title>
<meta name="description" content="Search The Urantia Book, read every paragraph on a place, and check a draft's quotes and what it left unread. Runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23E7E5E1' stroke='%23B9B4AC' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2346618A'/%3E%3C/svg%3E">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="mark-light" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D5CF"/>
    </radialGradient>
  </defs>
</svg>

<header class="bar">
  <a class="brand" href="./" aria-label="UB Tools Studio home">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="17" fill="url(#mark-light)"/>
      <circle cx="20" cy="20" r="17" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1"/>
      <circle cx="20" cy="20" r="6.5" fill="#46618A"/>
      <circle cx="18" cy="18" r="2" fill="#FFFFFF" fill-opacity=".45"/>
    </svg>
    <span>UB Tools Studio</span>
  </a>
  <div class="bar-right">
    <label class="voice-pick" id="voice-wrap" hidden><span class="sr">Reading voice</span><select id="voice" aria-label="Reading voice"></select></label>
    <button type="button" class="soft size" id="bigger" aria-pressed="false">Larger text</button>
    <p class="status" id="status" role="status">Opening the book</p>
  </div>
</header>

<main>
  <section class="slab" aria-label="Ask the book">
    <div class="modes" role="tablist" aria-label="What to do">
      <button role="tab" id="tab-ask" aria-selected="true" aria-controls="panel" data-mode="ask">Ask</button>
      <button role="tab" id="tab-search" aria-selected="false" aria-controls="panel" data-mode="search">Search</button>
      <button role="tab" id="tab-places" aria-selected="false" aria-controls="panel" data-mode="places">Places</button>
      <button role="tab" id="tab-check" aria-selected="false" aria-controls="panel" data-mode="check">Check a draft</button>
      <span class="modes-thumb" aria-hidden="true"></span>
    </div>

    <form class="well" id="ask" autocomplete="off">
      <label class="sr" for="q" id="q-label">Search the book</label>
      <input id="q" name="q" type="search" placeholder="Words, a phrase, or a reference like 180:2.1" disabled>
      <textarea id="draft" name="draft" rows="9" placeholder="Paste a draft that quotes the book. Quotes need a citation after them, like &quot;...&quot; (180:2.1)." hidden disabled></textarea>
      <div class="well-actions">
        <button class="mic" type="button" id="mic" aria-label="Speak your question" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8.5 21h7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="go" type="submit" id="go" disabled>Ask the book</button>
      </div>
    </form>

    <div class="groove" id="groove" aria-hidden="true"><span id="groove-fill"></span></div>
    <p class="hint" id="hint">The book loads once and stays in this browser. Nothing you type leaves your computer.</p>
    <div class="chips" id="chips" hidden></div>
  </section>

  <div class="work" id="panel" role="tabpanel" aria-labelledby="tab-ask">
    <section class="results" id="results" aria-live="polite"></section>
    <aside class="tablet" id="tablet" aria-label="Paragraph" hidden>
      <div class="tablet-inner">
        <button class="close" id="tablet-close" type="button" aria-label="Close paragraph">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <p class="t-ref" id="t-ref"></p>
        <p class="t-where" id="t-where"></p>
        <blockquote class="t-text" id="t-text"></blockquote>
        <div class="t-actions">
          <button type="button" class="soft" id="t-prev">Previous paragraph</button>
          <button type="button" class="soft" id="t-next">Next paragraph</button>
        </div>
        <div class="t-actions t-share">
          <button type="button" class="soft strong" id="t-copy">Copy</button>
          <button type="button" class="soft" id="t-sharebtn">Share</button>
          <button type="button" class="soft" id="t-pic">Quote picture</button>
          <button type="button" class="soft" id="t-print">Print this passage</button>
        </div>
        <div id="t-menu"></div>
        <p class="t-note" id="t-note"></p>
      </div>
    </aside>
  </div>
</main>

<div class="player" id="player" role="region" aria-label="Reading aloud" hidden>
  <div class="p-now"><span class="p-dot" aria-hidden="true"></span><span id="p-label">Reading</span> <strong id="p-ref"></strong></div>
  <div class="p-controls">
    <button type="button" id="p-prev" aria-label="Back to the previous paragraph">Back</button>
    <button type="button" id="p-pause">Pause</button>
    <button type="button" id="p-stop" class="p-stop">Stop</button>
    <button type="button" id="p-next" aria-label="Next paragraph">Next</button>
  </div>
</div>

<footer class="foot">
  <p>Book text from <a href="https://urantiapedia.org">Urantiapedia</a> (CC BY-SA 4.0). The same checks as ub-verify.js and ub-recall.js in <a href="https://github.com/UBN606/ub-tools">UB Tools</a>, by the <a href="https://urantiabooknetwork.com">Urantia Book Network</a>.</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
